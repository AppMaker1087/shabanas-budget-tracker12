name: Build Shabanas Budget Tracker APK

on:
  workflow_dispatch:

jobs:
  build:
runs-on: ubuntu-24.04
    steps:

      - name: Free disk space
        uses: endersonmenezes/free-disk-space@v4
        with:
          remove_android: false
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: love-actions/love-actions-android@v2
        with:
          app-name: "Shabanas Budget Tracker"
          bundle-id: "com.mano.shabanabudgettracker"
          love-ref: "11.5"
          love-package: "./game.love"
          product-name: "ShabanasBudgetTracker"
          version-string: "1.0.0"
          version-code: 1
          output-folder: "./build"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shabanas-Budget-Tracker-APK
          path: "./build/*.apk"
